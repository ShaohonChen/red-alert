<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="示意图：对话面板文字由默认配色变为红色">
  <rect width="960" height="420" rx="24" fill="#f5f7fa"/>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
    <text x="28" y="40" font-size="16" fill="#5b6472">默认配色</text>
    <text x="496" y="40" font-size="16" font-weight="600" fill="#d92525">对话文字变红</text>
  </g>

  <!-- Left: default palette -->
  <g transform="translate(28,56)">
    <rect width="436" height="340" rx="18" fill="#ffffff" stroke="#e3e7ee"/>
    <rect x="16" y="12" width="140" height="10" rx="5" fill="#e6eaf0"/>
    <line x1="16" y1="36" x2="420" y2="36" stroke="#eef1f5" stroke-width="1"/>
    <rect x="20" y="64" width="300" height="10" rx="5" fill="#c6cdd6"/>
    <rect x="20" y="84" width="360" height="10" rx="5" fill="#c6cdd6"/>
    <rect x="20" y="104" width="220" height="10" rx="5" fill="#c6cdd6"/>
    <rect x="20" y="140" width="280" height="10" rx="5" fill="#c6cdd6"/>
    <rect x="20" y="160" width="320" height="10" rx="5" fill="#c6cdd6"/>
    <rect x="236" y="200" width="180" height="48" rx="14" fill="#eaf3ff"/>
    <rect x="252" y="216" width="130" height="8" rx="4" fill="#b9c4d2"/>
    <rect x="252" y="230" width="90" height="8" rx="4" fill="#b9c4d2"/>
    <rect x="16" y="272" width="404" height="48" rx="14" fill="#ffffff" stroke="#dfe4ea"/>
    <rect x="28" y="286" width="2" height="16" fill="#c6cdd6"/>
    <rect x="36" y="290" width="180" height="8" rx="4" fill="#c6cdd6"/>
    <circle cx="396" cy="296" r="12" fill="#3964fe"/>
  </g>

  <!-- Right: red text -->
  <g transform="translate(496,56)">
    <rect width="436" height="340" rx="18" fill="#ffffff" stroke="#f0c9c9"/>
    <rect x="16" y="12" width="140" height="10" rx="5" fill="#e6eaf0"/>
    <line x1="16" y1="36" x2="420" y2="36" stroke="#eef1f5" stroke-width="1"/>
    <rect x="20" y="64" width="300" height="10" rx="5" fill="#ec1313"/>
    <rect x="20" y="84" width="360" height="10" rx="5" fill="#ec1313"/>
    <rect x="20" y="104" width="220" height="10" rx="5" fill="#ec1313"/>
    <rect x="20" y="140" width="280" height="10" rx="5" fill="#ec1313"/>
    <rect x="20" y="160" width="320" height="10" rx="5" fill="#ec1313"/>
    <rect x="236" y="200" width="180" height="48" rx="14" fill="#eaf3ff"/>
    <rect x="252" y="216" width="130" height="8" rx="4" fill="#ec1313"/>
    <rect x="252" y="230" width="90" height="8" rx="4" fill="#ec1313"/>
    <rect x="16" y="272" width="404" height="48" rx="14" fill="#ffffff" stroke="#f0c9c9"/>
