<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Red conversation text — 让对话面板的文字变红">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="40" r="280" fill="#ef4444" opacity="0.08"/>
  <circle cx="1120" cy="380" r="200" fill="#ec1313" opacity="0.06"/>

  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif">
    <rect x="72" y="58" width="272" height="34" rx="17" fill="#ef4444" opacity="0.16"/>
    <text x="88" y="80" font-size="14" fill="#fca5a5">DeepSeek Harness · Web UI plugin</text>

    <text x="72" y="196" font-size="58" font-weight="700" fill="#ffffff">Red conversation text</text>
    <rect x="72" y="216" width="110" height="4" rx="2" fill="#ef4444"/>
    <text x="72" y="264" font-size="26" fill="#f87171">让对话面板的文字，红得理直气壮。</text>
    <text x="72" y="302" font-size="16" fill="#94a3b8">Zero dependencies · No build step · One scoped stylesheet</text>
  </g>

  <!-- Illustration: a schematic conversation card (not a real screenshot) -->
  <g transform="translate(764,92)">
    <rect width="364" height="216" rx="18" fill="#ffffff"/>
    <rect x="18" y="16" width="120" height="8" rx="4" fill="#e6eaf0"/>
    <line x1="18" y1="38" x2="346" y2="38" stroke="#eef1f5" stroke-width="1"/>
    <rect x="22" y="62" width="250" height="9" rx="4.5" fill="#ec1313"/>
    <rect x="22" y="82" width="300" height="9" rx="4.5" fill="#ec1313"/>
    <rect x="22" y="102" width="180" height="9" rx="4.5" fill="#ec1313"/>
    <rect x="200" y="128" width="146" height="40" rx="12" fill="#eaf3ff"/>
    <rect x="216" y="143" width="100" height="7" rx="3.5" fill="#ec1313"/>
    <rect x="216" y="155" width="70" height="7" rx="3.5" fill="#ec1313"/>
    <rect x="18" y="178" width="328" height="30" rx="10" fill="#ffffff" stroke="#f0c9c9"/>
    <rect x="28" y="187" width="2" height="12" fill="#ec1313"/>
    <rect x="36" y="189" width="120" height="7" rx="3.5" fill="#ec1313"/>
    <circle cx="330" cy="193" r="8.5" fill="#3964fe"/>
  </g>
</svg>
